<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NES emulator</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; overflow-x: hidden; }
        #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; padding: 20px; }
        .game-card { background: #333; padding: 15px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .game-card:hover { border-color: #ff0000; background: #444; }
        #emulator-container { width: 100vw; height: 100vh; display: none; position: fixed; top: 0; left: 0; background: black; z-index: 100; }
        .controls { padding: 20px; background: #222; border-bottom: 2px solid #444; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 5px; }
        button:active { background: #b30000; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>NES Library</h1>
        <div class="controls">
            <input type="file" id="rom-upload" accept=".nes" hidden>
            <button onclick="document.getElementById('rom-upload').click()">+ Add Game to DB</button>
        </div>
        <div id="library"></div>
    </div>

    <div id="emulator-container">
        <div style="width:100%;height:100%;" id="game"></div>
        <button onclick="location.reload()" style="position:absolute; top:10px; left:10px; z-index:999;">Back to Menu</button>
    </div>

    <script>
        let db;
        const request = indexedDB.open("NES_Library", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("roms")) {
                db.createObjectStore("roms", { keyPath: "name" });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            displayLibrary();
        };

        // 1. Save ROM to IndexedDB
        document.getElementById('rom-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const transaction = db.transaction(["roms"], "readwrite");
                transaction.objectStore("roms").put({ name: file.name, data: event.target.result });
                transaction.oncomplete = displayLibrary;
            };
            reader.readAsDataURL(file);
        };

        // 2. Show Library from IndexedDB
        function displayLibrary() {
            const list = document.getElementById('library');
            list.innerHTML = "";
            const transaction = db.transaction("roms", "readonly");
            const store = transaction.objectStore("roms");
            
            store.getAll().onsuccess = (e) => {
                e.target.result.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `<div style="font-size: 2rem;">🎮</div><small>${game.name}</small>`;
                    card.onclick = () => startGame(game.data);
                    list.appendChild(card);
                });
            };
        }

        // 3. Start EmulatorJS
        function startGame(romData) {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('emulator-container').style.display = 'block';

            // Configuration for EmulatorJS
            window.EJS_player = "#game";
            window.EJS_core = "nes"; // Target NES core
            window.EJS_gameUrl = romData; 
            
            // CORRECTED LINKS:
            // Path to the data files (shaders, cores, etc)
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            const script = document.createElement('script');
            // Path to the loader script
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
